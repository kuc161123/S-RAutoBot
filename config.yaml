risk:
  max_daily_loss: 0.1
  max_position_size_pct: 0.15
  # [2026-07] Lowered 1.2% -> 0.3% base for small-account drawdown control. Validated
  # on genuinely-OOS data ($1,500 start): 0.3% cut the cold-period drawdown ~63% -> ~26%
  # (roughly HALVED loss + drawdown) vs the old 1.2%. Note: this reduces the SIZE of
  # losses while the edge is cold; it does not create profit (edge is negative OOS).
  risk_per_trade: 0.003
  # [VALIDATED 2026-06] Net-directional exposure cap: block a new entry if it would push
  # |open long risk - open short risk| above this fraction of equity. Caps correlated
  # one-sided (net-short) blowups. Validated to cut max drawdown ~30-40pts across bull+bear
  # OOS windows with equal-or-better return. Set null/0 to disable.
  net_directional_cap: 0.10
  # [UNIFIED AUTO-RAMP] ALL risk overlays (net-directional cap, BTC short-gate, bull
  # long-boost) stay OFF below this balance — the account runs in pure max-growth mode —
  # then engage together once it reaches the threshold. Validated 2026-06: in a bear/chop
  # the gates COST growth while small (they remove winning shorts and add drawdown), so
  # ramping everything on at ~$25k beat both always-on and pure all-off in ~90% of windows.
  # Set 0 to keep overlays always on. (Legacy key net_directional_cap_min_balance still
  # honored as a fallback for the cap only.)
  overlay_ramp_min_balance: 0
  # [WITHDRAWAL TARGET] When wallet balance exceeds this, the dashboard shows how much
  # to withdraw to bring it back to target. Compounding above this adds little growth
  # (taper floors risk) but raises absolute drawdown $. Set 0 to disable the alert.
  withdrawal_target: 50000
  # [DISABLED 2026-08-12 — see risk_study/] The gate below was validated in 2026-07 against
  # the OLD per-symbol fitted rr/atr_mult. Under the global rr=10/atr_mult=3.0 configuration
  # it COSTS money: measured -705.8R over the full history, and it barely touches the tail it
  # was built for (worst-10-days -964.7R with the gate vs -1004.1R without — a 4% reduction
  # for a 705R bill). Turning it off: in-sample ROI/DD 19.8 -> 53.7 with drawdown FALLING
  # 47.0% -> 44.4%; wins 8 of 11 independent rolling 6-month windows.
  #
  # HONEST CAVEAT, do not lose this: the gate NEVER FIRED during the untouched holdout
  # (2026-05-25 onward), so holdout results are byte-identical with it on or off. ALL the
  # evidence above is IN-SAMPLE. It also contradicts the 2026-07 validation quoted below,
  # and the 3 of 11 windows where removal loses are most likely the bull windows the gate
  # was designed for. If BTC 30d return goes above +10% and STAYS there, this is the change
  # most likely to hurt — re-enable it if that regime arrives.
  #
  # Original note: skip SHORT entries during a SUSTAINED IMPULSE bull — BTC trailing 30-day
  # return (daily closes, causal) above short_gate_ret30. The old 1H-EMA200 signal flipped
  # ~26x/month and blocked profitable shorts; the swap beat it on 4/5 windows incl. the bear
  # control and turned the 2023/24 disaster bull from -39% into -10%.
  btc_short_gate: false
  # Impulse-bull threshold (fraction of 30d BTC return). 0.10 = balanced (disaster
  # protection + ~+8% lifetime); 0.15 = higher lifetime total, less protection.
  short_gate_ret30: 0.10
  # [TIGHTENED 2026-08-12 0.30 -> 0.10 — see risk_study/] Gross open-risk cap: block a new
  # entry if TOTAL open risk (sum of all open positions' risk-at-entry) would exceed this
  # fraction of equity. Bounds the flash-crash "all stops hit at once" scenario.
  #
  # At 0.30 this cap almost never bound — it was pure tail insurance with zero effect on
  # normal operation. At 0.10 it becomes an active exposure budget, and that is where the
  # drawdown actually lives: on the ten worst days of this strategy, 100-165 correlated
  # positions resolve at once. Tightening it is the ONLY change in this study that improved
  # the untouched holdout (+7.6% -> +11.0%) AND won 10 of 11 independent rolling 6-month
  # windows — the most consistent single result measured.
  #
  # The exact value is NOT special: across rolling windows 0.08 wins 5 and 0.10 wins 5, while
  # 0.30 wins 0 of 11. The DIRECTION is robust; treat 0.10 as "clearly tighter than 0.30",
  # not as an optimum. Set 0 to disable.
  gross_open_risk_cap: 0.10
  # [VALIDATED 2026-06] Bull long-boost: multiply LONG per-trade risk by this factor when
  # BTC 1H close is above its 200 EMA (market uptrend) — the profitable side in a bull.
  # Validated to lift bull-market long returns ~20% (86% of bull windows) at ~equal
  # drawdown, neutral in bears. 1.0 = off; 1.3 = validated sweet spot (higher = overfit risk).
  long_bull_boost: 1.3
  # [2026-07] Conservative schedule anchored at 0.3%, descending gently as the account
  # grows (drawdown-$ control at scale). Was 0.7%->0.3%; now 0.3%->0.14%.
  # [VALIDATED 2026-07-25] SHADOW GATE — the shadow learner now HALTS and RESUMES live
  # entries on trailing shadow R. This is the one deliberate exception to the shadow
  # layer's "observe only" contract; observation itself is unaffected (log_signal runs
  # before this gate, so the ledger keeps filling while halted and the gate can reopen).
  #
  # Evidence (backtest_shadow_gate.py, genuine OOS 2026-05-25 -> 2026-07-25, $1,500):
  #   ungated  $914 (-39%), maxDD 55.5%    <- what the bot did without this
  #   7d gate  $2,112 (+41%), maxDD 15.3%  <- this setting
  #   never trading $1,500
  # All 60 tested threshold combinations beat ungated; 93% were outright profitable, so
  # the result does not hinge on these exact numbers. See EDGE_DIAGNOSIS_2026-07-25.md.
  #
  # NOTE the bands here are in the HUNDREDS. The /learn advisory bands (-25/-35R) are
  # ~10x too tight for this signal population (trailing-7d R: median -19R, p10 -385R).
  # MODE — 'advisory' (default) alerts you to run /stop or /start but never blocks a
  # trade itself; 'auto' enforces the halt in code. Advisory is the validated default:
  # the gate switches only ~once every 17-28 days (21 switches/yr at 7d, 13/yr at 21d),
  # and reacting late costs almost nothing — OOS from $1,500: instant $2,112, 24h late
  # $2,091, 72h late $2,083, a full week late $1,853, versus $914 never acting. So a
  # human in the loop captures ~99% of the benefit with none of the automation risk.
  shadow_gate:
    enabled: true
    mode: advisory          # advisory | auto
    # [CHANGED 2026-08-12 7d -> 21d — see risk_study/] Across the full toggle matrix the 21d
    # window improved the untouched holdout by +21.8 points (median across 4 configurations)
    # at zero cost in equity or drawdown, while the 7d window cost 1.5 points. 21d switches
    # ~13x/yr vs 21x/yr, so it is also less operator load for an advisory signal.
    window_days: 21         # 21 = validated 2026-08; 7 = previous setting, worse on holdout
    stop_r: -300            # advise halting when trailing R falls to/below this
    start_r: 200            # advise resuming when trailing R recovers to/above this (21d pair)
    min_signals: 150        # refuse to act on thin data — hold current state below this
    recheck_minutes: 20     # how often to re-evaluate (DB query throttle)
  # [TRAILING STOP — variant "s3_a1"] Deployed 2026-08-02 as DRAWDOWN CONTROL ONLY.
  # Claims here were revised 2026-08-06 — see STRATEGY_FINDINGS_2026-08.md. Read that
  # before changing anything; two of the original justifications did not survive.
  #
  # WHAT HOLDS (every window, every cost level tested — 6/6):
  #   drawdown       15mo 28.9% vs base 50.6% · 6mo 27.7% vs 35.4% · OOS 36.7% vs 44.8%
  #   concentration  top 1% of trades = 24% of profit, vs 112% for the fixed-TP base
  #
  # WHAT WAS WITHDRAWN:
  #   * the RETURN claim. "trailing beat base 13/13 paired runs over 15 months" was real
  #     but NOT robust: shifting the same 15-month window by 12 days at each end flips it
  #     to 0/9 the other way, on data verified 99.9% identical. The paired protocol
  #     controlled for trade ORDERING but not for window boundaries.
  #   * "ahead of base at 1.0x, 1.5x AND 2.0x costs". On 5m-resolved data base wins at
  #     2.0x ($33,387 vs $28,472). The original was 1H-resolved and wrong.
  #
  # DO NOT ADD A BREAKEVEN MOVE **TO A BARE TRAIL**. Every be* trail variant lost to its
  # non-be twin in every period: s2_a1 $107,230 → be1_s2_a1 $61,778 (−42%). Tight trails
  # also lose (s1_a1 $80,799). A bare trail needs to be LATE and WIDE.
  #   NOTE the exception, or a future test will be rejected wrongly: breakeven HELPS when
  #   paired with PARTIAL take-profits (scale-out), +0.367 vs +0.208 mean R for 25/25/25/25.
  #   The difference is that TP1 has already banked real profit before the stop tightens,
  #   whereas a bare trail moving to breakeven cuts a winner short having banked nothing.
  #
  # Toggle live from Telegram with /trail on|off (no redeploy). This value is the
  # boot default; /trail overrides it until the next restart.
  trailing_stop:
    enabled: true
    trigger_r: 3.0          # arm only once MFE >= this many R. Lower = worse (tested).
    atr_mult: 1.0           # trail this many ATR behind each CLOSED candle's extreme
    min_step_pct: 0.0       # 0 = exact backtest parity (verify_trailing_parity.py runs
                            # at 0). Raise only to suppress sub-tick amendments; any
                            # value >0 lets the live stop lag the validated rule.
    notify: true            # Telegram on arm / R-milestone / failure
    shadow: true            # run the counterfactual learner (see /trailstats)
  taper_schedule:
  - - 1500
    - 0.003
  - - 3000
    - 0.0028
  - - 5000
    - 0.0025
  - - 8000
    - 0.0022
  - - 12000
    - 0.002
  - - 20000
    - 0.0017
  - - 40000
    - 0.0014
